services:
  bot:
    build: .
    container_name: telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./bot-data:/bot/data
    environment:
      - DB_PATH=/bot/data/bot.db
      - PORT=8080
    ports:
      # only needed for local health checks; the bot long-polls Telegram
      - "8080:8080"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
